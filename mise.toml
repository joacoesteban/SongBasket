[tools]
node = "24"
bun = "1"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install dependencies and the Electron binary"
run = "bun install"

[tasks.dev]
description = "Run the app with hot reload"
run = "electron-vite dev"

[tasks.preview]
description = "Build and run the app as it ships"
run = "electron-vite preview"

[tasks.test]
description = "Bundle and run persistence, route-animation, and shortcut tests"
run = "bun build tests/persistence.test.ts --target=node --outfile=temp/persistence.test.mjs && bun build tests/animation.test.ts --target=node --outfile=temp/animation.test.mjs && bun build tests/shortcuts.test.ts --target=node --outfile=temp/shortcuts.test.mjs && node --test temp/persistence.test.mjs temp/animation.test.mjs temp/shortcuts.test.mjs"

[tasks."typecheck:main"]
description = "Typecheck the main process"
run = "tsc --noEmit -p tsconfig.main.json"

[tasks.typecheck]
description = "Typecheck the main process, preload, shared contracts, and renderer"
run = "mise run typecheck:main && mise run typecheck:preload && mise run typecheck:renderer"

[tasks."typecheck:preload"]
description = "Typecheck the preload bridge and shared contracts"
run = "tsc --noEmit -p tsconfig.preload.json"

[tasks."typecheck:renderer"]
description = "Typecheck the renderer"
run = "vue-tsc --noEmit -p tsconfig.renderer.json"

[tasks.format]
description = "Format source and configuration files"
run = "prettier --write 'src/**/*.ts' 'src/**/*.vue' 'src/**/*.css' 'src/**/*.scss' electron.vite.config.ts electron-builder.yml tsconfig.base.json tsconfig.main.json tsconfig.renderer.json eslint.config.mjs .prettierrc package.json"

[tasks."format:check"]
description = "Check source and configuration formatting"
run = "prettier --check 'src/**/*.ts' 'src/**/*.vue' 'src/**/*.css' 'src/**/*.scss' electron.vite.config.ts electron-builder.yml tsconfig.base.json tsconfig.main.json tsconfig.renderer.json eslint.config.mjs .prettierrc package.json"

[tasks.lint]
description = "Lint and check formatting"
run = "eslint . && mise run format:check"

[tasks."lint:fix"]
description = "Lint and format source files"
run = "eslint . --fix && mise run format"

[tasks.build]
description = "Bundle main and renderer into out/"
run = "electron-vite build"


[tasks.pack]
description = "Bundle and package an unsigned local app"
depends = ["build"]
run = "electron-builder --dir"

[tasks.dist]
description = "Bundle and package distributables for the current platform"
depends = ["build"]
run = "electron-builder"
