appId: com.joacoesteban.songbasket
productName: SongBasket
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/fileicon/**/*
publish:
  provider: github
  owner: joacoesteban
  repo: songbasket
mac:
  icon: assets/icons/songbasket.icns
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: assets/icons/songbasket.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: assets/icons/songbasket.png
  category: Audio
  target:
    - AppImage
